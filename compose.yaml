services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-toyota_root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-toyota_ccr}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  setup:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD:-toyota_root_password}@db:3306/${MARIADB_DATABASE:-toyota_ccr}
      SEED_USER_NAME: ${SEED_USER_NAME:-Admin CCR}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-change-this-password}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run prisma:push && npm run seed:user"
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD:-toyota_root_password}@db:3306/${MARIADB_DATABASE:-toyota_ccr}
      REPORT_DATABASE_URL: ${REPORT_DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-auth-secret-before-production}
      AUTH_TRUST_HOST: "true"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

volumes:
  mariadb-data:
